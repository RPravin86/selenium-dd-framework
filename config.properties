baseUrl = https://automationexercise.com
browser = chrome
headless = false
acceptInsecureCerts = false

# Page load strategy: normal = full load, eager = DOM ready, none = no page-load wait
pageLoadStrategy = eager

# Screenshot mode: base64 = embed in report, file = save PNG inside the execution report folder
screenshotMode = base64

# Root directory for all generated report types
reportRoot = ./reports
reportTitle = Automation Exercise - Test Execution Report