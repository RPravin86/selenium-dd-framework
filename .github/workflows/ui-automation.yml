name: UI Automation

on:
  push:
    branches:
      - main
      - feature/framework-modernization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Chrome UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run UI automation tests
        run: mvn --batch-mode clean test -Dbrowser=chrome -Dheadless=true

      - name: Upload framework reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-automation-reports
          path: reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-results
          path: target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
